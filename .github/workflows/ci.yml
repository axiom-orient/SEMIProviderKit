name: CI

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Current Xcode
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: swift --version
      - name: Format
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Architecture boundaries
        run: python3 Scripts/verify-providerkit-boundaries.py
      - name: Debug tests
        run: swift test --parallel -Xswiftc -warnings-as-errors
      - name: Release tests
        run: swift test --parallel -c release -Xswiftc -warnings-as-errors
